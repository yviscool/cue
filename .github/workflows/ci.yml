name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Windows Direct3D 11)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Code Hygiene & Vet
        run: go vet ./...

      - name: Run Test Suite
        run: go test -v -count=1 ./...

      - name: Build Windows Binary (cue.exe)
        run: go build -ldflags="-H windowsgui -s -w -X github.com/yviscool/cue/internal/version.Version=ci" -o cue.exe .

      - name: Upload Test Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue-windows-x64-ci
          path: cue.exe
          if-no-files-found: error
          retention-days: 7
